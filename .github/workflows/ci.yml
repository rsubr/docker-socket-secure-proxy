name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...
      - name: Static build check
        run: |
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o bin/docker-socket-secure-proxy ./cmd/docker-socket-secure-proxy
          file bin/docker-socket-secure-proxy | grep -q 'statically linked'
